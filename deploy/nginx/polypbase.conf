upstream polypbase_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name polypbase.org www.polypbase.org;

    root /srv/polypbase/app/frontend/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location /static/ {
        alias /srv/polypbase/app/backend/staticfiles/;
        expires 7d;
    }

    location ~ ^/(api|admin|accounts|boites|bac)/ {
        proxy_pass http://polypbase_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /politique-confidentialite/ {
        proxy_pass http://polypbase_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
