name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check CSS, TypeScript, and production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-length-never-used-outside-actions
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_DELIVERY_ENABLED: "0"
      POSTGRES_DB: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: .

      - name: Check Django configuration
        run: >-
          uv run --frozen python manage.py check
          --settings=config.test_settings

      - name: Check production security settings
        run: >-
          uv run --frozen python manage.py check --deploy
          --settings=config.settings

      - name: Check for missing migrations
        run: >-
          uv run --frozen python manage.py makemigrations
          --check --dry-run --settings=config.test_settings

      - name: Run backend tests
        run: >-
          uv run --frozen python manage.py test
          --settings=config.test_settings
