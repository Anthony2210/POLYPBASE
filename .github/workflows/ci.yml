name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:all

      - name: Check CSS, TypeScript, and production build
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-enough-length-never-used-outside-actions
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_DELIVERY_ENABLED: "0"
      POSTGRES_DB: ""
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      POLYPBASE_TEST_POSTGRES: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: .

      - name: Check committed gettext catalogs before generation
        working-directory: .
        run: uv run --frozen python -B scripts/compile_django_messages.py --check

      - name: Check backend i18n coverage and translation history
        working-directory: .
        run: |
          uv run --frozen python -B docs/translation-review/application/check_register.py
          uv run --frozen python -B scripts/check_i18n.py

      - name: Test i18n tooling and register regressions
        working-directory: .
        run: |
          uv run --frozen python -B -m unittest discover -s scripts -p test_compile_django_messages.py
          uv run --frozen python -B -m unittest discover -s scripts -p test_check_i18n.py
          uv run --frozen python -B -m unittest discover -s docs/translation-review/application -p "test_*.py"

      - name: Check Django configuration
        run: >-
          uv run --frozen python manage.py check
          --settings=config.preflight_settings

      - name: Check production security settings
        run: >-
          uv run --frozen python manage.py check --deploy
          --settings=config.settings

      - name: Check for missing migrations
        run: >-
          uv run --frozen python manage.py makemigrations
          --check --dry-run --settings=config.preflight_settings

      - name: Run backend tests
        run: >-
          uv run --frozen python manage.py test
          --settings=config.test_settings

  box-1902:
    name: Box 1902 PostgreSQL regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_DOTENV_DISABLED: "1"
      POLYPBASE_TEST_POSTGRES: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Test disposable PostgreSQL launcher
        run: >-
          uv run --frozen python -B -m unittest discover
          -s scripts -p test_historical_temperature_launcher.py

      - name: Install PostgreSQL 18 binaries
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install --yes postgresql-18

      - name: Run genuine-role Box 1902 regression tests
        run: >-
          uv run --frozen python -B scripts/test_historical_temperature_production.py
          --run --pg-bin /usr/lib/postgresql/18/bin
          apps.cultures.test_box_1902_correction_v2_postgres
